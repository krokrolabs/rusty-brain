- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  config:
    providers:
      ollama:
        apiKeyEnv: RB_TEST_SECRET
        api: openai-completions
        baseURL: http://127.0.0.1:11434/v1
        models:
          - id: qwen3.8:27b-mlx
            contextWindow: 262144
            maxTokens: 4096
- id: agent-default-model
  config:
    provider: ollama
    model: qwen3.8:27b-mlx
- id: session-telemetry-otel
  config:
    mode: DISABLED
- id: web-search-deepseek
  disabled: true
- id: tool-web
  disabled: true
- id: session-persistence-jsonl
  config:
    root: !!js process.env.RUSTY_BRAIN_VERIFY_ROOT + '/sessions'
    compression: none
