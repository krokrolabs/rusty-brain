- insert:
    - id: memory-rusty-brain
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: rusty-brain
        transport: stdio
        command: rusty-brain
        args: !!js >-
          process.env.RUSTY_BRAIN_PROJECT
            ? ['--project', process.env.RUSTY_BRAIN_PROJECT, 'serve']
            : ['serve']
        cwd: !!js process.cwd()
