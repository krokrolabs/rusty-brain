[package]
name = "rusty-brain"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Local-first memory for AI coding agents: libsql store, fastembed local embeddings, MCP server, Parquet exports"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libsql = "0.10"
fastembed = "7.6"
rmcp = { version = "3.9", features = ["server", "transport-io", "macros", "schemars"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "6"
arrow = "60"
arrow-schema = "60"
parquet = { version = "60", features = ["arrow"] }
thiserror = "2"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
rmcp = { version = "3.9", features = ["client", "transport-child-process"] }
